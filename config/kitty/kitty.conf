# ==============================================================================
# 🛸 SOLARIS SPACECRAFT COMMAND DECK — SYSTEM CONSOLE TERMINAL
# Deep obsidian carbon surface, restrained cyan telemetry, high readability
# ==============================================================================

# Typography
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono NF Bold
italic_font      JetBrainsMono NF Italic
bold_italic_font JetBrainsMono NF Bold Italic
font_size        11.5

disable_ligatures never

# Spacecraft Beam Cursor
cursor                #00f0ff
cursor_text_color     #04070c
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_trail          2
cursor_trail_decay    0.1 0.3

# Terminal Surface & Translucency
window_padding_width  12
background_opacity    0.94
background_blur       1
dynamic_background_opacity yes
confirm_os_window_close 0

# Color Palette: Deep Space Obsidian & Restrained Cyan Telemetry
background            #05080e
foreground            #dff8f6

selection_foreground  #04070c
selection_background  #00f0ff

# Black (Deep Bulkhead Armor)
color0                #0a1017
color8                #182432

# Red (Plasma Containment Breach / Alert)
color1                #ff2a5f
color9                #ff527b

# Green (Bioluminescent Life Support / Nominal)
color2                #00ff88
color10               #39ff7a

# Yellow (Plasma Core / Warning)
color3                #ffb703
color11               #ffd166

# Blue (Subspace Propulsion / Subsystems)
color4                #0099ff
color12               #38b6ff

# Magenta (Psionic Warp Matrix)
color5                #a855f7
color13               #c084fc

# Cyan (Sensor Telemetry / Primary HUD)
color6                #00f0ff
color14               #70fbfd

# White (Starlight Starmap / Text)
color7                #dff8f6
color15               #ffffff

# URL & Highlighting
url_color             #00f0ff
url_style             curly

# Spacecraft Console Tabs
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    " ⬡ {index}: {title} "
active_tab_foreground   #04070c
active_tab_background   #00f0ff
active_tab_font_style   bold
inactive_tab_foreground #536b78
inactive_tab_background #090e15

# Visual Bell
enable_audio_bell     no
visual_bell_duration  0.10
visual_bell_color     #00f0ff

# Keybindings
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
