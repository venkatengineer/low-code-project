# ==============================================================================
# 🛸 SOLARIS SPACECRAFT // VOICE-CONTROLLED HYPRLOCK
# ==============================================================================

general {
    hide_cursor = false
    immediate_render = true
}

background {
    monitor =
    path = $HOME/Pictures/Wallpapers/solaris_cockpit_dashboard.jpg
    blur_passes = 2
    blur_size = 5
    noise = 0.015
    contrast = 1.05
    brightness = 0.75
    color = rgba(6, 12, 18, 1.0)
}

# 1. Big Cyber Clock
label {
    monitor =
    text = $TIME
    color = rgba(0, 229, 255, 0.95)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 229, 255, 0.5)
}

# 2. Date Readout
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A // %B %d, %Y // SECTOR %Z')"
    color = rgba(125, 211, 252, 0.85)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 100
    halign = center
    valign = center
}

# 3. Holographic Security Status Box
label {
    monitor =
    text = [ BIOMETRIC ACOUSTIC RESONANCE SENSOR ONLINE ]
    color = rgba(0, 229, 255, 0.65)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 229, 255, 0.4)
}

# 4. Authentication Input Field (Password / PIN fallback)
input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(0, 229, 255, 0.8)
    inner_color = rgba(10, 20, 30, 0.75)
    font_color = rgba(224, 242, 254, 0.95)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font

    placeholder_text = <span foreground="##7dd3fc"><i>ENTER AUTH KEY...</i></span>
    hide_input = false
    check_color = rgba(0, 255, 170, 0.9)
    fail_color = rgba(255, 42, 95, 0.9)
    fail_text = <i>ACCESS DENIED ($ATTEMPTS)</i>

    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 166, 251, 0.4)
}

# 5. Bottom System Diagnostics
label {
    monitor =
    text = cmd[update:2000] echo "🛸 PROPULSION: STANDBY // POWER: 82% // WARP CORE: READY"
    color = rgba(125, 211, 252, 0.6)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
